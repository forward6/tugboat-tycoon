<meta charset="utf-8">
<title>Tugboat Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: the map fills the screen; a ruled top bar; an inspector card on the right (a bottom sheet on narrow screens); notices print as sheets of newsprint. */
:root{
  --land:#e4e2c3; --field-a:#d9dcae; --field-b:#ebe4c3; --hedge:#c3c194; --forest:#bfd0a2; --tree:#93b07f;
  --shield:#b7c69f; --tree-dark:#6f9168; --rock:#d6c8bc;
  --water:#7fb1d1; --shoal:#bfe0ec; --coast:#41779a; --river:#5e98c0;
  --sand:#efe0b0; --relief:#7a7152; --quartz:#f1eee6; --roof-a:#a9573f; --roof-b:#6e737b; --roof-c:#8c6a47; --wall:#ece3cf; --wood:#b08f64;
  --road:#f2c75c; --road-casing:#8c7a55; --street:#d8cfb8; --elevator:#d9cfb2; --coal-pile:#2b2b2b; --lumber-pile:#d9b26b; --stack-p:#e4b94a;
  --ink:#1c2731; --ink-2:#56616b; --rule:#c2b183;
  --surface:#fbf7ec; --surface-2:#efe6cf; --magenta:#a3306a; --on-magenta:#ffffff;
  --player:#1c2731; --rival:#9c4126; --good:#35704a; --warn:#9d7015; --bad:#ab352d; --money:#2c6a3c;
  --shadow:rgba(28,39,49,.22); --scrim:rgba(28,39,49,.45);
  --c-logs:#8b5a2b; --c-lumber:#b98a36; --c-coal:#3d4248; --c-supplies:#3f6f9a; --c-fish:#3f8282;
  --h1:#3a6ea5; --h2:#c0582c; --h3:#2a8a6a; --h4:#b8860b; --h5:#8e4f8f; --hx:#a59f8c;
  --font-display:"IM Fell English SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-chart:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font-ui:"Alegreya Sans","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --land:#2a2e24; --field-a:#2e3327; --field-b:#272b21; --hedge:#3a3f30; --forest:#25301f; --tree:#344a2f;
    --shield:#212a1f; --tree-dark:#2f4529; --rock:#3d3832;
    --sand:#5e5640; --relief:#9c9373; --quartz:#6a6862; --roof-a:#8a4a37; --roof-b:#525860; --roof-c:#6c5439; --wall:#4a473f; --wood:#7a6446; --road:#b38b3a; --road-casing:#0f1210; --street:#3c3b33; --elevator:#77705e; --coal-pile:#0c0c0c; --lumber-pile:#9c7f48; --stack-p:#c9a23e; --water:#10293a; --shoal:#1c4458; --coast:#6aa3c4; --river:#4e86a8;
    --ink:#dbe3e3; --ink-2:#9aa6ab; --rule:#3f453b;
    --surface:#151c21; --surface-2:#1d272d; --magenta:#e56aa3; --on-magenta:#1b0e15;
    --player:#eef3f1; --rival:#ec8f66; --good:#83c592; --warn:#e5b961; --bad:#f2827a; --money:#93d6a3;
    --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.58);
    --c-logs:#c88f56; --c-lumber:#dfbd73; --c-coal:#aab2ba; --c-supplies:#84b4df; --c-fish:#7fc6c6; --h1:#5b92cc; --h2:#d9703f; --h3:#3aa883; --h4:#b88a1e; --h5:#b277b3; --hx:#6c7479;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --land:#2a2e24; --field-a:#2e3327; --field-b:#272b21; --hedge:#3a3f30; --forest:#25301f; --tree:#344a2f; --shield:#212a1f; --tree-dark:#2f4529; --rock:#3d3832; --sand:#5e5640; --relief:#9c9373; --quartz:#6a6862; --roof-a:#8a4a37; --roof-b:#525860; --roof-c:#6c5439; --wall:#4a473f; --wood:#7a6446; --road:#b38b3a; --road-casing:#0f1210; --street:#3c3b33; --elevator:#77705e; --coal-pile:#0c0c0c; --lumber-pile:#9c7f48; --stack-p:#c9a23e; --water:#10293a; --shoal:#1c4458; --coast:#6aa3c4; --river:#4e86a8;
  --ink:#dbe3e3; --ink-2:#9aa6ab; --rule:#3f453b;
  --surface:#151c21; --surface-2:#1d272d; --magenta:#e56aa3; --on-magenta:#1b0e15;
  --player:#eef3f1; --rival:#ec8f66; --good:#83c592; --warn:#e5b961; --bad:#f2827a; --money:#93d6a3;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.58);
  --c-logs:#c88f56; --c-lumber:#dfbd73; --c-coal:#aab2ba; --c-supplies:#84b4df; --c-fish:#7fc6c6; --h1:#5b92cc; --h2:#d9703f; --h3:#3aa883; --h4:#b88a1e; --h5:#b277b3; --hx:#6c7479;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--surface-2);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#chart{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#water,#light{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#chart.pointing{cursor:pointer}
#chart.dragging{cursor:grabbing}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

/* ---------- HUD frame ---------- */
#hud{position:fixed;inset:0;pointer-events:none;display:grid;gap:10px;
  grid-template-columns:minmax(0,1fr) 352px;grid-template-rows:auto minmax(0,1fr);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 12px)}
#topbar,#panel,#mapArea>*{pointer-events:auto}
#mapArea{position:relative;pointer-events:none;min-height:0}

#topbar{grid-column:1/-1;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:6px 8px 6px 14px;box-shadow:0 1px 0 var(--rule),0 6px 18px -10px var(--shadow)}
.brand{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.brand small{display:block;font-family:var(--font-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.tb-sep{width:1px;align-self:stretch;background:var(--rule)}
.tb-stat{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tb-stat .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tb-stat .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb-stat .val.neg{color:var(--bad)}
#weather .val{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#weather .fc{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#weather .fc.alert{color:var(--bad);font-weight:700}
.tb-grow{flex:1 1 0;min-width:0}
.speed{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.speed button{width:46px;height:42px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.speed button+button{border-left:1px solid var(--rule)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.speed svg{width:20px;height:20px}
.tb-controls{display:flex;gap:8px;align-items:center}
.iconbtn{min-width:44px;height:42px;border:1px solid var(--rule);border-radius:4px;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700}
.iconbtn svg{width:20px;height:20px}

/* ---------- inspector ---------- */
#panel{grid-column:2;grid-row:2;align-self:start;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;box-shadow:0 10px 30px -14px var(--shadow)}
#panelInner{padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.sheet-handle{display:none}
.p-head{display:flex;flex-direction:column;gap:2px}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
h2{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:400;font-size:18px;margin:4px 0 0;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--rule);padding-bottom:3px}
h3 .count{font-family:var(--font-ui);font-size:12px;color:var(--ink-2);font-weight:700}
.desc{margin:0;font-family:var(--font-chart);font-size:16px;line-height:1.38;color:var(--ink)}
.fine{margin:0;font-size:13px;color:var(--ink-2)}
.status{margin:0;font-size:15px;font-weight:500}
.back{border:0;background:transparent;color:var(--magenta);font-weight:700;cursor:pointer;padding:8px 2px;min-height:40px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.chart{display:block;width:100%;height:auto;margin:4px 0 8px}
.chart .line{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart text{font:11px var(--font-ui);fill:var(--ink-2)}
.chart .band{stroke:var(--surface);stroke-width:1;stroke-linejoin:round}
.chart .paid{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4}
.chart .hxl{stroke:var(--ink);stroke-width:1}
.chart .dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.8}
.hchart{touch-action:pan-y;cursor:crosshair;-webkit-user-select:none;user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;flex-shrink:0}
.item .sw{width:14px;height:14px;justify-self:center}
.lk{display:inline-block;width:18px;border-top:2px solid var(--ink)} .lk.dash{border-top-style:dashed}
.hread{margin:0;font-size:13.5px;min-height:2.6em}
.item .side small{font-weight:700}
.kv dt{color:var(--ink-2);font-size:13.5px}
.kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--money)} .neg{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--magenta);border-color:var(--magenta);color:var(--on-magenta)}
.btn.ghost{border-color:var(--rule)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.wide{flex:1 1 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{font-weight:500;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{min-height:38px;padding:0 12px;border:1px solid var(--rule);border-radius:99px;background:transparent;font-weight:700;font-size:13.5px;cursor:pointer}
.pick:disabled{opacity:.4;cursor:default}
.chip{font-size:12.5px;font-weight:700;border:1px solid var(--rule);border-radius:99px;padding:2px 9px;color:var(--ink-2);white-space:nowrap}
.chip.mine{border-color:var(--magenta);color:var(--magenta)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:9px 2px;cursor:pointer;min-height:48px}
.item:hover{background:var(--surface-2)}
.btn .btn-ic{width:18px;height:18px;margin-right:8px;vertical-align:-3px;flex-shrink:0}
.sharecard{display:block;width:100%;height:auto;aspect-ratio:1200/630;border:1px solid var(--rule);border-radius:4px;margin:4px 0 2px;background:var(--surface-2)}
.sharecard.wait{display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.sharemsg summary{min-height:36px}
.sharemsg summary::-webkit-details-marker{display:none}
.sharemsg summary::before{content:'▸';margin-right:6px}
.sharemsg[open] summary::before{content:'▾'}
.sharegrid{display:grid;gap:8px}
.sharegrid > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.sharegrid h3{margin-top:6px}
@media (min-width: 900px){
  .sheet.wide{width:min(960px,100%)}
  .sharegrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
  .sharegrid .sharecard{margin-top:6px}
}
.sharemsg p{margin:2px 0 6px;padding:8px 10px;border-left:3px solid var(--rule);font-size:14px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.iconbtn svg{width:20px;height:20px}
#soundBtn[aria-pressed="false"]{color:var(--ink-2)}
.slider{display:flex;align-items:center;gap:12px;margin:10px 0 0;font-size:15px}
.slider span{flex:0 0 170px}
.slider input{flex:1;min-width:0;height:32px;accent-color:var(--magenta)}
.pl-list{list-style:none;margin:0 0 10px;padding:0}
.pl-row{border-bottom:1px solid var(--rule);padding:10px 0}
.pl-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pl-head b{font-size:17px} .pl-head span{color:var(--ink-2);font-size:14px}
.pl-row .fine{margin:3px 0 0}
.newtag{display:inline-block;padding:2px 7px;border-radius:3px;background:var(--magenta);color:var(--on-magenta);font-size:12px;font-weight:700}
/* the boats' plans: a side view on her page, the whole sheet in a viewer you can zoom */
.planthumb{position:relative;display:block;width:100%;margin:6px 0 10px;padding:0;border:1px solid var(--rule);border-radius:4px;background:#f4ecd9;cursor:zoom-in;overflow:hidden}
.planthumb svg{display:block;width:100%;height:auto;max-height:190px}
.planthumb .pt-tag{position:absolute;right:6px;bottom:6px;padding:3px 8px;border-radius:3px;background:rgba(34,48,58,.86);color:#f4ecd9;font-size:12.5px;font-weight:700;pointer-events:none}
.model .planthumb{grid-column:1/-1;margin:0}
#planView{position:fixed;inset:0;z-index:28;display:flex;flex-direction:column;background:#1b2229;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(12px,env(safe-area-inset-left,0px))}
#planView[hidden]{display:none}
#planView .pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 2px 10px;color:#f4ecd9}
#planView .pv-bar b{font-family:var(--font-display);font-size:22px;font-weight:400}
#planView .pv-btns{display:flex;gap:8px}
#planView .pv-btns .btn{min-height:46px;min-width:46px;font-size:17px}
#planView .pv-btns .btn:not(.primary){background:#f4ecd9;color:#22303a;border-color:#f4ecd9}
#pvStage{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:4px;touch-action:none;cursor:grab;background:#3b4148}
#pvStage.grabbing{cursor:grabbing}
#pvSheet{position:absolute;left:0;top:0;transform-origin:0 0}
#pvSheet svg{display:block}
#planView .pv-hint{margin:8px 0 0;text-align:center;color:#d8d2c2;font-size:14px}
#planView .pv-turn{display:none}
@media (max-width:600px) and (orientation:portrait){#planView .pv-turn{display:inline}}
/* the first-play tour */
#coach{position:fixed;inset:0;z-index:25;pointer-events:none}
#coach .cm-shade,#coach .cm-block{position:fixed;background:rgba(9,14,19,.66);pointer-events:auto}
#coach .cm-block{background:transparent}
#coach .cm-ring{position:fixed;border:3px solid var(--magenta);border-radius:10px;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 24px 6px rgba(255,255,255,.35);pointer-events:none;animation:cmPulse 1.6s ease-in-out infinite}
#coach .cm-card{position:fixed;box-sizing:border-box;width:min(440px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:16px 20px 18px;box-shadow:0 24px 48px -16px rgba(0,0,0,.6);pointer-events:auto}
#coach .cm-card.in{animation:toastIn .22s ease-out}
#coach .cm-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#coach .cm-step{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#coach .cm-skip{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:15px;text-decoration:underline;min-height:44px;padding:0 4px;cursor:pointer}
#coach h2{font-family:var(--font-display);font-size:28px;line-height:1.1;margin:4px 0 10px}
#coach .cm-body{font-size:19px;line-height:1.45;margin:0}
#coach .cm-dots{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap}
#coach .cm-dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
#coach .cm-dots i.past{background:var(--ink-2)} #coach .cm-dots i.on{background:var(--magenta);transform:scale(1.25)}
#coach .cm-actions{display:flex;gap:10px}
#coach .cm-actions .btn{flex:1;min-height:54px;font-size:18px}
#coach .cm-back[hidden]{display:none}
@keyframes cmPulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,.9),0 0 30px 10px rgba(255,255,255,.45)}}
@media (prefers-reduced-motion: reduce){#coach .cm-ring,#coach .cm-card.in{animation:none}}
#picker{position:fixed;z-index:30;width:min(280px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:6px;box-shadow:0 16px 32px -14px var(--shadow);padding:4px;animation:toastIn .15s ease-out}
#picker .lead{margin:0;padding:6px 10px 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
#picker button{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;text-align:left;min-height:46px;padding:4px 10px;border:0;border-radius:4px;background:transparent;color:inherit;font:inherit;cursor:pointer}
#picker button:hover,#picker button:focus-visible{background:var(--surface-2)}
#picker b{display:block;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#picker small{display:block;font-size:12.5px;color:var(--ink-2)}
.item b{display:block;font-size:15px}
.item small{display:block;color:var(--ink-2);font-size:13px;line-height:1.3}
.item .side{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
.glyph{width:22px;height:22px;display:block}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;border:1px solid var(--rule)}
.bar i{display:block;height:100%;background:var(--good)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.hull{display:flex;align-items:center;gap:8px}
.hull .bar{flex:1}
table.cargo{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
table.cargo th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;font-weight:700;padding:2px 0 4px;border-bottom:1px solid var(--rule)}
table.cargo td{padding:6px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
table.cargo td.n{text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:1px}
.pay{font-weight:700;font-size:13px}
.pay.hi{color:var(--good)} .pay.mid{color:var(--warn)} .pay.lo{color:var(--bad)}
.seg{display:flex;flex-shrink:0;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:0;background:transparent;font-weight:700;cursor:pointer}
.seg button+button{border-left:1px solid var(--ink)}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => (n < 0 ? '−$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-CA');
const round10 = n => Math.round(n / 10) * 10;
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const inCrash = day => day >= D.crash && day < D.crashEnd;
// The pine is cut out after 1900: fewer logs come down the rivers and the sawmills close one by one.
const pineLeft = day => { const y = (day - dayOf(1900, 1, 1)) / 365; return y <= 0 ? 1 : Math.max(.35, 1 - .03 * y); };
const millsLeft = day => { const y = (day - dayOf(1905, 1, 1)) / 365; return y <= 0 ? 1 : Math.max(.3, 1 - .035 * y); };
// Sea lamprey: arrives in Lake Huron in the late 1930s, peaks around 1950, falls back once control starts in 1955.
const lampreyLevel = day => day < D.lamprey ? 0 : day < D.glfc ? Math.min(.45, (day - D.lamprey) / 365 * .04) : Math.max(.08, .45 - (day - D.glfc) / 365 * .04);
